[project]
name = "citeguard"
version = "0.1.0"
description = "Budget-Bounded Research Service with Verified Citations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.0",
    "alembic>=1.13.0",
    "arq>=0.26.0",
    "httpx>=0.27.0",
    "trafilatura>=1.12.0",
    "rapidfuzz>=3.9.0",
    "pydantic>=2.9.0",
    "sentence-transformers>=3.0.0",
    "groq>=0.11.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

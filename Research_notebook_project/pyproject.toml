[project]
name = "citeguard"
version = "0.1.0"
description = "Budget-Bounded Research Service with Verified Citations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.0",
    "alembic>=1.13.0",
    "arq>=0.26.0",
    "httpx>=0.27.0",
    "trafilatura>=1.12.0",
    "rapidfuzz>=3.9.0",
    "pydantic>=2.9.0",
    "sentence-transformers>=3.0.0",
    "groq>=0.11.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "mcp>=1.0.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[project.optional-dependencies]
# Evaluation-only NLI baseline (DeBERTa-MNLI, ~1.5 GB download incl. torch). Not needed in production.
eval = ["transformers==4.46.3", "torch==2.5.1"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = [
    "B008",
    "E402",   # Module level import not at top of file (sys.path manipulation for standalone tools/scripts)
    "E501",   # Line length (prompts and benchmarks require long verbatim quotes)
    "UP047",  # Type parameters on generic functions
]

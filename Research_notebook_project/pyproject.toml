[project]
name = "citeguard"
version = "0.1.0"
description = "Budget-Bounded Research Service with Verified Citations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.0",
    "alembic>=1.13.0",
    "httpx>=0.27.0",
    "trafilatura>=1.12.0",
    "rapidfuzz>=3.9.0",
    "pydantic>=2.9.0",
    "sentence-transformers>=3.0.0",
    "groq>=0.11.0",
    "langgraph>=0.2.0",
    "mcp>=1.0.0",
    "python-dotenv>=1.0.0",  # uvicorn --env-file
    "pymupdf>=1.24.0",  # PDF text + font sizes for headings (AGPL-3.0: fine for this open-source repo)
]

[project.optional-dependencies]
test = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "ruff>=0.6.0", "hypothesis>=6.100", "pytest-cov>=5", "pytest-randomly>=3.15", "pip-audit>=2.7"]
# Evaluation-only NLI baseline (DeBERTa-MNLI, ~1.5 GB download incl. torch). Not needed in production.
eval = ["transformers==4.46.3", "torch==2.5.1"]

[tool.setuptools.packages.find]
include = ["app*"]  # evals/, alembic/, scripts/ are repo tools, not part of the installed package

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "live: needs a real provider key and spends money; run only with `pytest -m live`",
    "sec: security tests (required CI check)",
    "chaos: fault injection; slow, nightly",
    "int: needs a real Postgres (TEST_DATABASE_URL)",
]
addopts = "-m 'not live and not chaos'"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["mutants"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = [
    "B008",
    "E402",   # Module level import not at top of file (sys.path manipulation for standalone tools/scripts)
    "E501",   # Line length (prompts and benchmarks require long verbatim quotes)
    "UP047",  # Type parameters on generic functions
]

[tool.mutmut]
source_paths = ["app/core/verifier.py"]

also_copy = ["app/", "tests/", "scripts/", "evals/", "pyproject.toml"]
pytest_add_cli_args = ["-m", "not live and not chaos and not int", "-p", "no:randomly", "-q"]
pytest_add_cli_args_test_selection = ["tests/test_verifier_phase1.py", "tests/property/test_verifier_properties.py", "tests/sec/test_injection_corpus.py", "tests/test_hard_cases.py", "tests/test_phase1_followups.py", "tests/test_verifier_branches.py", "tests/test_verifier_survivors.py"]
